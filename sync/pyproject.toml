[project]
name = "pb-coach-sync"
version = "0.1.0"
description = "Servicio de sync Garmin -> Postgres vía garmin-mcp. Único paquete que depende del SDK de MCP."
requires-python = ">=3.12"
dependencies = [
    "pb-coach-core",
    "pb-coach-persistence",
    "mcp>=1.9",
    "starlette",
    "uvicorn>=0.30",
]

[tool.uv.sources]
pb-coach-core = { workspace = true }
pb-coach-persistence = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# La carpeta es el paquete: `sync/` se importa como `sync`.
[tool.setuptools]
packages = ["sync"]
package-dir = { "sync" = "." }
