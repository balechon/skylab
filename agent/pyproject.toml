[project]
name = "skylab-agent"
version = "0.1.0"
description = "Agente LLM y API de SKYLAB. No depende de MCP."
requires-python = ">=3.12"
dependencies = [
    "skylab-core",
    "skylab-persistence",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=1.2.16",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
]

[tool.uv.sources]
skylab-core = { workspace = true }
skylab-persistence = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# La carpeta es el paquete: `agent/` se importa como `agent`.
[tool.setuptools]
packages = ["agent"]
package-dir = { "agent" = "." }
