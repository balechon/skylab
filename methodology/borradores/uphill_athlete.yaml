# BORRADOR — perfil de Uphill Athlete, en revisión.
#
# Fuente: House, S., Johnston, S. y Jornet, K. "Training for the Uphill
# Athlete. A Manual for Mountain Runners and Ski Mountaineers". Patagonia
# Works, 2019. ISBN 978-1-938340-84-0 (rústica).
#
# Vive en methodology/borradores/: el sistema solo carga
# methodology/profiles/, así que este borrador no se usa para planificar
# hasta que esté revisado y se mueva allí.
#
# Cómo está hecho:
#   - Cada regla resume, con otras palabras, lo que dice el libro y cita el
#     capítulo y la sección (la transcripción no tiene números de página).
#     Ninguna regla de este archivo sale de fuera del libro.
#   - Solo se transcribe lo que aplica a carrera de montaña; skimo y esquí
#     de montaña quedan fuera.
#   - Las cifras que el libro da tal cual son de origen "autor". Las que
#     convierten una indicación vaga en un número son de origen "propio" y
#     NO están activas: están en "propuestas_propias", al final, para que
#     decidas tú.
#   - Lo marcado "PENDIENTE" necesita una decisión o un dato tuyo.
#
# Estado de cada sección:
#   reglas, restricciones_globales, reglas_secuenciales,
#   reglas_conteo_microciclo, reglas_ajuste, secuencias_bloques
#       → ya existen en el modelo. Las reglas cuyos parámetros conoce el
#         motor se comprueban en código; el resto las sigue y cita el agente
#         (quedan como "no evaluables" hasta que tengan evaluador).
#   categorias_atleta, zonas, tests, tipos_semana, reglas_carreras,
#   fuera_del_modelo, propuestas_propias
#       → secciones nuevas: el modelo todavía no las acepta.
#
# Figuras incorporadas: 3.3, 10.1–10.3, 11.7–11.10 y 13.1–13.6. Las de
# skimo no aplican.

autor: "UPHILL_ATHLETE"
fuente: "House, Johnston y Jornet. Training for the Uphill Athlete. Patagonia Works, 2019. ISBN 978-1-938340-84-0"
version: "0.1.0"

deportes_soportados:
  - "trail running"

# =====================================================================
# reglas
# =====================================================================
reglas:

  # ---------- progresión ----------

  # Comprobada por el motor (incremento_maximo_pct). El motor compara con la
  # última semana de carga, nunca con la descarga, que es como lo plantea el
  # libro ("salvo después de una semana de recuperación").
  - id: "UA-PROGRESION-001"
    categoria: "Progresión"
    descripcion: "Distancia, desnivel y tiempo no suben más de un 10 % de una semana a la siguiente, salvo tras una semana de recuperación (cap. 11, Base Period Guidelines; en la transición el libro da 7–10 %, cap. 10)."
    parametros:
      incremento_maximo_pct: 10

  - id: "UA-PROGRESION-002"
    categoria: "Progresión"
    descripcion: "No subir distancia, desnivel e intensidad en la misma semana: subir una sola cosa; si hay que subir dos, que entre ambas no pasen del 15 % (p. ej. +10 % de distancia y +5 % de desnivel). No hacer subidas de más del 15 % dos semanas seguidas; tras un salto cercano al 15 %, semana de recuperación (cap. 11, Base Period Guidelines)."
    parametros:
      incremento_combinado_max_pct: 15

  - id: "UA-PROGRESION-003"
    categoria: "Progresión"
    descripcion: "El desnivel sube como mucho un 10 % entre semanas consecutivas y un 20 % en un bloque de cuatro semanas (tres de subida y una de recuperación) (cap. 13, Notes for Weekly Vertical)."
    parametros:
      incremento_desnivel_max_pct: 10
      incremento_desnivel_4_semanas_max_pct: 20

  - id: "UA-PROGRESION-004"
    categoria: "Progresión"
    descripcion: "Con una carrera objetivo: la primera semana empieza con no más de la mitad de su desnivel total (entre un tercio y la mitad si eres nuevo en el deporte), y al menos dos semanas del final de la base o de la precompetición acumulan el desnivel total de la carrera, coincidiendo con las semanas de más distancia (cap. 11, Base Period Guidelines; cap. 13, Notes for Weekly Vertical)."
    parametros:
      desnivel_primera_semana_max_fraccion_carrera: 0.5
      semanas_con_desnivel_de_carrera_min: 2

  - id: "UA-PROGRESION-005"
    categoria: "Progresión"
    descripcion: "Volumen anual: quien entrena menos de 350–400 h al año puede subir hasta un 25 % por año; quien entrena más de 500 h, como mucho un 10 % (cap. 3, Gradualness)."
    parametros:
      incremento_anual_max_pct_principiante: 25
      incremento_anual_max_pct_avanzado: 10

  - id: "UA-PROGRESION-007"
    categoria: "Progresión"
    objetivo_mesociclo: "Transición"
    descripcion: "Transición de 8 semanas: semanas 1–3 de subida, +7–10 % por semana; semana 4 de recuperación, −50 % respecto a la 3; semana 5 = semana 3 + 10 %; semanas 6–7, +5–7 %; semana 8 de recuperación, −50 % respecto a la 7 (cap. 10, fig. 10.1)."
    parametros:
      semanas: 8
      reduccion_recuperacion_pct: 50

  - id: "UA-PROGRESION-006"
    categoria: "Progresión"
    objetivo_mesociclo: "Transición"
    descripcion: "Volumen inicial de la transición: tras más de 4 semanas sin entrenar, empezar con el 50 % de las horas semanales medias del ciclo anterior; si solo cambias de deporte con no más de 2 semanas de parón, con el 80 % (cap. 10, Where to Start)."
    parametros:
      volumen_inicial_pct_tras_parada_larga: 50
      volumen_inicial_pct_cambio_deporte: 80

  # ---------- carga y estructura de la semana ----------

  - id: "UA-CARGA-001"
    categoria: "Carga"
    descripcion: "Una semana de recuperación baja la carga entre un 40 y un 60 % respecto a la última semana grande (el menú de semanas da un 50 %), desnivel incluido, con no más de una sesión de intensidad; con una sobrecarga planificada, hasta un 70 % (cap. 11, Base Period Guidelines y R Week)."
    parametros:
      reduccion_descarga_min_pct: 40
      reduccion_descarga_max_pct: 60

  - id: "UA-CARGA-002"
    categoria: "Carga"
    descripcion: "En semanas de base e intensidad, la salida larga es el 30–40 % de la distancia o el desnivel semanal (más en semanas de poco volumen), y el resto se reparte en al menos cuatro sesiones (cap. 11, B Week e I Week)."
    clase_sesion: "Fondo"
    parametros:
      larga_min_pct_semana: 30
      larga_max_pct_semana: 40

  - id: "UA-CARGA-003"
    categoria: "Carga"
    descripcion: "Volumen mínimo para empezar un plan de 50K: semanas habituales de unos 40 km. Pico de 80–88 km y media de 50 km en las 12 semanas más grandes (cap. 13, Recommended Minimum Peak Weekly Distances)."
    parametros:
      distancia_carrera_km: 50
      semana_previa_km: 40
      pico_semana_min_km: 80
      media_12_semanas_km: 50

  - id: "UA-CARGA-004"
    categoria: "Carga"
    descripcion: "Volumen mínimo para un 100K: haber asimilado las cargas del 50K. Pico de 120–130 km y media de 75 km en las 16 semanas más grandes. Para 100 millas: pico de 145–160 km y media de 100 km en las 18 más grandes (cap. 13, Recommended Minimum Peak Weekly Distances)."
    parametros:
      distancia_carrera_km: 100
      pico_semana_min_km: 120
      media_16_semanas_km: 75

  # ---------- intensidad ----------

  # Comprobadas por el motor (zona_fc_minima).
  - id: "UA-INTENSIDAD-001"
    categoria: "Intensidad"
    tipo_sesion: "Tempo"
    descripcion: "El tempo es un esfuerzo continuo en Z3, de 20 a 60 minutos, con 10–20 minutos de Z1 antes y después (cap. 5, Higher-Intensity Continuous Workouts)."
    parametros:
      zona_fc_minima: "Z3"

  - id: "UA-INTENSIDAD-002"
    categoria: "Intensidad"
    tipo_sesion: "Umbral"
    descripcion: "Intervalos de umbral en Z3, en el umbral de lactato o justo por debajo: trabajo de 8–15 min (10–20 según la tabla de zonas) con 2–4 min de recuperación activa y 40–60 min de trabajo total; si eres nuevo, 3–6 min con relación trabajo:descanso de 3:1 o 4:1. Para Cat. 1, empezar con 20–30 min en total, p. ej. 3×7 o 3×8 min (cap. 5, Threshold Intervals; cap. 9, Workout Categories; cap. 11, Guidelines for intensity)."
    parametros:
      zona_fc_minima: "Z3"

  - id: "UA-INTENSIDAD-003"
    categoria: "Intensidad"
    tipo_sesion: "Series"
    descripcion: "Intervalos de potencia aeróbica en Z4 (90–95 % de la FC máx.), mejor en subida: trabajo de 30 s a 8 min, relación 1:1 (hasta 2 min de recuperación), recuperación activa, 15–30 min de trabajo total. Si eres nuevo en el entrenamiento estructurado, empezar con 30/30 (cap. 5, Aerobic Power Intervals y 30/30s; cap. 9, Workout Categories)."
    parametros:
      zona_fc_minima: "Z4"

  - id: "UA-INTENSIDAD-004"
    categoria: "Intensidad"
    tipo_sesion: "Base"
    descripcion: "El trabajo de base va en Z1 y Z2: sesiones continuas de 30 min a varias horas en Z1, de 30 a 90 min en Z2 (la tabla de zonas dice 30–90; el texto, hasta 120). Si la FC sube, se camina en las subidas para no salir de zona; en las bajadas se deja bajar (cap. 3, Zone 1 y Zone 2; cap. 5, Continuous Training y Keep It Simple)."
    parametros:
      zona_fc_maxima: "Z2"
      duracion_continua_min_minutos: 30

  - id: "UA-INTENSIDAD-005"
    categoria: "Intensidad"
    tipo_sesion: "Fondo"
    descripcion: "La salida larga es de capacidad aeróbica: en Z1 si la diferencia entre umbrales es del 10 % o menos, en Z2 si es mayor. Tiene que cansar por la duración, no por la intensidad (cap. 10, Workout Notes)."
    parametros:
      zona_fc_maxima: "Z2"

  - id: "UA-INTENSIDAD-006"
    categoria: "Intensidad"
    tipo_sesion: "Recuperación"
    descripcion: "Las sesiones de recuperación van por debajo de Z1 (por debajo del AeT − 20 % según la tabla de zonas), continuas de 20 a 60 min, en terreno menos empinado. Deben dejarte mejor de lo que empezaste (cap. 3, Recovery Zone; cap. 5, Recovery Workouts)."
    parametros:
      zona_fc_maxima: "Z1"

  - id: "UA-INTENSIDAD-007"
    categoria: "Intensidad"
    descripcion: "Distribución anual: un 80–90 % del volumen en Z1–Z2 (la Z1 sola, 50–70 % del volumen aeróbico); Z3 no más del 10 %; Z4 menos del 10 % (cap. 3, Zone 1 y Zone 3; cap. 5, Continuous Training; cap. 9, Workout Categories)."
    parametros:
      z1_z2_min_pct_anual: 80
      z3_max_pct_anual: 10
      z4_max_pct_anual: 10

  - id: "UA-INTENSIDAD-008"
    categoria: "Intensidad"
    descripcion: "En semanas de base, de recuperación y de especificidad, la Z2 no pasa del 15 % del volumen semanal y el resto de la base va en Z1, salvo en el síndrome de deficiencia aeróbica (más de un 10 % entre umbrales), en el que casi toda la base va en Z2. Al introducir Z3 o Z4 se deja la Z2 y la base pasa a Z1 (cap. 11, B Week; cap. 13, Notes on Adding More Intensity)."
    parametros:
      z2_max_pct_semanal: 15

  - id: "UA-INTENSIDAD-009"
    categoria: "Intensidad"
    descripcion: "Introducir intensidad: la Z3 empieza con un 5 % del tiempo semanal o menos y sube como mucho un 10 % por semana. La Z4 se añade cuando la Z3 ronda el 10 % y se asimila bien, sustituyendo Z3 por la mitad de Z4 (2 min de Z3 por 1 de Z4) y empezando con no más del 5 % semanal. La intensidad nunca puede hacer bajar más de un 5 % el volumen de Z1–Z2 (cap. 11, I Week y Guidelines for intensity; cap. 13, Notes on Adding More Intensity)."
    parametros:
      z3_inicial_max_pct_semanal: 5
      z3_incremento_max_pct_semanal: 10
      z4_inicial_max_pct_semanal: 5
      caida_base_max_pct: 5

  - id: "UA-INTENSIDAD-010"
    categoria: "Intensidad"
    descripcion: "Los entrenamientos de Z3 y de Z4 van en días distintos, con al menos 72 h entre ellos. Una sesión intensa debe poder asimilarse en 48 h; si a las 72 h las piernas siguen cansadas, la siguiente se recorta (cap. 5, 30/30s; cap. 11, I Week)."
    parametros:
      horas_minimas_entre_intensidad: 72

  - id: "UA-INTENSIDAD-011"
    categoria: "Intensidad"
    objetivo_mesociclo: "Base aeróbica"
    descripcion: "Los entrenamientos continuos de más intensidad (tempo o distancia progresiva) se añaden tras 6–8 semanas de base, uno cada 10–14 días, con uno o dos días de recuperación después (cap. 5, Higher-Intensity Continuous Workouts y Summary)."
    parametros:
      semanas_base_previas_min: 6
      dias_entre_sesiones_min: 10

  - id: "UA-INTENSIDAD-012"
    categoria: "Intensidad"
    objetivo_mesociclo: "Base aeróbica"
    descripcion: "Aceleraciones (pick-ups): una vez por semana dentro de un rodaje de Z1–Z2, a partir de unas semanas de base. De 6 a 8, de 8–15 s (el menú de sesiones da hasta 30 s), a ritmo rápido pero divertido, nunca a sprint, con 2 min suaves entre ellas (cap. 5, Pick-ups; cap. 9, Workout Categories)."
    parametros:
      sesiones_por_semana: 1
      repeticiones_max: 8

  - id: "UA-INTENSIDAD-013"
    categoria: "Intensidad"
    descripcion: "Sprints en cuesta: una vez por semana en la base si tu fuerza general es suficiente. Cuesta de un 30 % aproximadamente; empezar con 6×10 s al máximo (90–95 % de la fuerza en las primeras sesiones), con recuperación completa de 2–3 min, y sumar como mucho 2 repeticiones por semana sin alargar más de 10 s cada una. Calentamiento largo obligatorio (cap. 5, Hill Sprints/Bounding; cap. 9, Anaerobic Capacity)."
    parametros:
      zona: "Z5"
      repeticiones_iniciales: 6
      incremento_repeticiones_semana_max: 2

  - id: "UA-INTENSIDAD-014"
    categoria: "Intensidad"
    descripcion: "Calentamiento y vuelta a la calma: para Z1–Z2 basta con empezar suave 10 min. Antes de intensidad, 10–15 min de Z1, movilidad dinámica y 2–3 min en Z3. Tras una sesión intensa o una carrera, 20–30 min de recuperación o Z1 (cap. 5, Warm-Up y Cool-Down)."
    parametros:
      calentamiento_intensidad_min_minutos: 10
      vuelta_calma_intensidad_min_minutos: 20

  # ---------- descanso y vuelta al entrenamiento ----------

  - id: "UA-DESCANSO-001"
    categoria: "Descanso"
    descripcion: "Tras un parón por fatiga de más de dos días, no retomar donde se dejó: un par de días suaves al 50 % de la duración, después un día al 75 %, y reevaluar (cap. 4, Returning to Training After a Break)."
    parametros:
      dias_parada_min: 2
      vuelta_pct_primeros_dias: 50
      vuelta_pct_despues: 75

  - id: "UA-DESCANSO-002"
    categoria: "Descanso"
    descripcion: "Ante los primeros síntomas de enfermedad, parar. Para volver, un día suave en Z1–Z2 por cada día de baja, subiendo poco a poco duración e intensidad (cap. 4, Illness y After the Illness)."
    parametros:
      dias_suaves_por_dia_de_baja: 1

  - id: "UA-DESCANSO-003"
    categoria: "Descanso"
    descripcion: "Una parada planificada (viaje, visita familiar) se puede preparar con una semana de carga algo mayor antes y usarse como recuperación, con pocas sesiones cortas y suaves (cap. 4, Planned Breaks in Training)."

# =====================================================================
# restricciones_globales
# =====================================================================
restricciones_globales:

  # Comprobada por el motor (microciclos_carga_max).
  - id: "UA-GLOBAL-001"
    descripcion: "Distancia y desnivel no suben más de tres semanas seguidas: el ciclo habitual es de tres semanas de subida y una de recuperación (3:1), o 2:1 o incluso 1:1 si tienes poca experiencia, sobre todo con sesiones intensas (cap. 11, Base Period Guidelines y Modulation of the Training Load)."
    parametros:
      microciclos_carga_max: 3

  # Comprobada por el motor (distancia_umbral_km + semanas_minimas).
  # PENDIENTE: el libro lo dice para un primer 50K de un atleta de Cat. 1.
  - id: "UA-GLOBAL-002"
    descripcion: "Para un primer 50K, el plan mínimo es de 20 semanas, precedido de al menos 6 de transición si no tienes un historial de carrera reciente (cap. 13, Structuring a Category 1 Athlete's Mountain Running Training Plan)."
    parametros:
      distancia_umbral_km: 42
      semanas_minimas: 20

# =====================================================================
# reglas_secuenciales
# =====================================================================
reglas_secuenciales:

  # Comprobada por el motor.
  - id: "UA-SECUENCIA-001"
    descripcion: "La intensidad y la fuerza necesitan 2–3 días para poder repetir una carga parecida; mientras, solo trabajo aeróbico suave o recuperación. Nunca dos días intensos seguidos (cap. 3, Recovery Times)."
    clase_sesion_previa: "Específico"
    clases_permitidas_despues:
      - "Fondo"
      - "Recuperación"
      - "Descanso"

# =====================================================================
# reglas_conteo_microciclo
# =====================================================================
reglas_conteo_microciclo:

  # Comprobada por el motor. PENDIENTE: el libro permite 2 solo con un 10 %
  # o menos entre umbrales; con más diferencia, 1 (ver categorias_atleta y
  # tests). Hasta tener tus umbrales queda el máximo general.
  - id: "UA-CONTEO-001"
    descripcion: "En el periodo de base, como mucho dos sesiones intensas por semana si la diferencia entre umbrales es del 10 % o menos; si es mayor, una, y sin Z3 todavía (cap. 11, The Cornerstone of the Base)."
    clase_sesion: "Específico"
    maximo: 2

# =====================================================================
# reglas_ajuste — el libro no da reglas "métrica → acción" con las
# métricas que hoy mide el motor. Estas son interpretaciones numéricas del
# atleta (origen propio), aceptadas el 2026-10-17.
# =====================================================================
reglas_ajuste:
  - id: "UA-AJUSTE-001"
    descripcion: "Si se cumple menos del 70 % del volumen planificado, se repite la semana en vez de progresar. Interpreta la regla de continuidad: perder más de un 5 % de la carga del mes obliga a dar un paso atrás y no se puede hacer como si se hubiera entrenado (cap. 3, Continuity)."
    condicion:
      metrica: "adherencia_volumen_pct"
      operador: "<"
      valor: 70
    accion: "repetir_microciclo"
    origen: "propio"

  - id: "UA-AJUSTE-002"
    descripcion: "Si la contrarreloj aeróbica no mejora entre dos tests seguidos, se reduce la carga. Interpreta que sin mejoras pequeñas en varias semanas algo falla (recuperación o progresión demasiado rápida) y que el ritmo en el AeT debería mejorar cada 2–4 semanas (cap. 5, Summary; cap. 9, Outline for Planning)."
    condicion:
      metrica: "mejora_test_pct"
      operador: "<="
      valor: 0
    accion: "reducir_carga"
    origen: "propio"

# =====================================================================
# secuencias_bloques
# =====================================================================
secuencias_bloques:

  # La transición es opcional (cap. 10): para quien empieza su primera
  # temporada estructurada, vuelve de un parón o cambia de deporte. Decisión
  # del atleta (2026-10-17): entrar directamente en la base.
  - id: "UA-BLOQUES-001"
    descripcion: "Sin un objetivo grande, el entrenamiento puede ser casi solo base: es lo que más rinde en montaña y lo que permite competir sobre esa base. Quien ya entrena con regularidad puede entrar directamente en la base, sin transición (cap. 4, Periodization; cap. 9, Outline for Planning; cap. 10)."
    modo: "Construcción"
    objetivos:
      - "Base aeróbica"

  - id: "UA-BLOQUES-002"
    descripcion: "Macrociclo hacia un objetivo: transición, base (el periodo más importante, de meses), precompetición o especificidad (semanas que imitan las exigencias de la carrera) y puesta a punto (cap. 4, Periodization; cap. 11, T Week y G Week)."
    modo: "Competición"
    objetivos:
      - "Transición"
      - "Base aeróbica"
      - "Específico competencia"
      - "Puesta a punto"

# =====================================================================
# SECCIONES NUEVAS — el modelo todavía no las acepta.
# =====================================================================

# Las reglas cambian según la categoría del atleta.
categorias_atleta:
  - id: "UA-CATEGORIA-1"
    descripcion: "Construir base: no ha superado las 400 h anuales de entrenamiento específico en los últimos 2 años, o tiene menos de 18 años, o no ha completado bien en los últimos 12 meses una carrera de la distancia o duración objetivo. Lo que más rinde es subir el volumen, despacio; por debajo de 400 h, varios ciclos de base (cap. 11, Step 1)."
    horas_anuales_max: 400
  - id: "UA-CATEGORIA-2"
    descripcion: "Mantener la base y complementarla: más de 400 h anuales durante al menos 2 años, más de 18 años, ha completado bien en los últimos 12 meses una carrera igual o cercana a la objetivo y compite varias veces al año. Lo que más rinde es la especificidad y algo más de intensidad, sin bajar el volumen de Z1–Z2 (cap. 11, Step 1)."
    horas_anuales_min: 400

# Zonas ancladas en el umbral aeróbico (AeT) y en el umbral de lactato (LT),
# según la figura 3.3. Con tus dos umbrales, las zonas salen en pulsaciones.
zonas:
  descripcion: "Cinco zonas por FC ancladas en dos umbrales propios, más precisas que las basadas en porcentajes de FC máx. Los límites son orientativos y varían de un día a otro (cap. 3, A Discussion of Intensity Zones; fig. 3.3)."
  recuperacion: { fc: "por debajo de AeT − 20 %", esfuerzo: "ligero", metodo: "continuo, 20–60 min" }
  Z1: { fc: "de AeT − 20 % a AeT − 10 %", esfuerzo: "muy fácil a fácil", metodo: "continuo, de 30 min a varias horas" }
  Z2: { fc: "de AeT − 10 % a AeT", esfuerzo: "moderado si tu AeT es alto, fácil si es bajo", metodo: "continuo, 30–90 min" }
  Z3: { fc: "de AeT a LT", esfuerzo: "medio, duro pero divertido, no agotador", metodo: "intervalos de 10–20 min o continuo hasta 60 min" }
  Z4: { fc: "de LT a FC máx.", esfuerzo: "duro, máximo sostenible", metodo: "intervalos de 30 s a 8 min" }
  Z5: { fc: "no aplica (la FC no sirve)", esfuerzo: "supramáximo, insostenible", metodo: "intervalos de 8 a 60 s" }

tests:
  - id: "UA-TEST-001"
    nombre: "Umbral aeróbico, método MAF"
    descripcion: "AeT = 180 − edad, con 2 años de entrenamiento regular sin contratiempos. Restar 5 si vuelves de una lesión o un parón largo o enfermas más de 2–3 veces al año; sumar 5 con más de 2 años progresando. Tiende a quedarse corto (cap. 5, Aerobic Threshold Testing)."
  - id: "UA-TEST-002"
    nombre: "Umbral aeróbico, marcador ventilatorio"
    descripcion: "La FC que se puede mantener respirando solo por la nariz o hablando sin cortarse. Solo es fiable con buena base aeróbica (cap. 5, Aerobic Threshold Testing)."
  - id: "UA-TEST-003"
    nombre: "Umbral aeróbico, escalones con lactato"
    descripcion: "Cinta al 5 % o cuesta moderada, 15 min de calentamiento, escalones de 3 min subiendo unas 10 ppm cada uno desde muy bajo. AeT = primer escalón con 2 mmol/L o más, o con una subida de 1 mmol/L (cap. 5, Aerobic Threshold Testing)."
  - id: "UA-TEST-004"
    nombre: "Umbral de lactato"
    descripcion: "Con las piernas frescas (bajar la carga unos días antes): 15–20 min de calentamiento terminando con 2–3 min en Z3, y después el máximo esfuerzo sostenible en subida, 30 min si estás menos entrenado y hasta 60. La FC media es el LT (cap. 5, Lactate Threshold Testing)."
    duracion_min_minutos: 30
  - id: "UA-TEST-005"
    nombre: "Test del 10 %"
    descripcion: "FC del LT dividida entre la FC del AeT. Más de 1,10 = síndrome de deficiencia aeróbica: más base en Z1–Z2 y no añadir Z3 todavía. 1,10 o menos: menos Z2, más Z1 y recuperación, y se puede introducir Z3 y Z4 (cap. 3, The Ten Percent Test; cap. 5, Getting Started)."
    umbral_ratio: 1.10
  - id: "UA-TEST-006"
    nombre: "Contrarreloj aeróbica"
    descripcion: "Cada dos semanas, aproximadamente: el mismo recorrido habitual a la FC del AeT, anotando el tiempo. Si el entrenamiento va bien, baja. El ritmo en el AeT debería mejorar cada 2–4 semanas (cap. 5, Getting Started y Summary)."
    frecuencia_semanas: 2
  - id: "UA-TEST-007"
    nombre: "Recuperación diaria"
    descripcion: "FC en reposo por la mañana (en las mismas condiciones), test del escalón (1–2 min subiendo y bajando un escalón, anotar la bajada de FC al minuto) o test de la escalera. Una FC en reposo elevada pide vigilar los días siguientes (cap. 4, Ways to Monitor for Recovery)."

# Recetas por tipo de semana: B (base), I (intensidad), R (recuperación),
# S (especificidad), T (taper) y G (semana de carrera). Cap. 11, Step 3.
tipos_semana:
  B: "Acumular tiempo, distancia y desnivel en Z1–Z2. Larga del 30–40 % del volumen y el resto en al menos 4 sesiones, dos con bajadas rápidas cortas. Dos sesiones de fuerza (general o específica) y dos de core. Recuperación activa al menos 3 veces. Si la fuerza muscular específica (ME) es tu punto débil, empezar aquí con ella."
  I: "Como la B (no la sustituye), añadiendo Z3 o Z4: Z3 al principio no más del 5 % del tiempo semanal; asimilable en 48 h. Se deja la ME. Un día de sprints en cuesta y dos de core."
  R: "Volumen al 50 %, poco estructurada, con días libres si hace falta. Larga del 40 % al final de la semana, otra sesión del 20 % y el resto en zona de recuperación (al menos dos). Intensidad, sprints y ME a la mitad. Un core. El domingo deberías tener ganas de atacar la semana siguiente."
  S: "Para ultras: dos largas seguidas que suman el 60–80 % del volumen semanal, el resto en al menos 3 sesiones; sin Z3 y una sola sesión de Z4 con el volumen de la semana anterior, separada 72 h de las largas. Sin ME. Un día de sprints y dos de core."
  T: "Larga del 50 % del volumen semanal y una sesión de Z2 de no más del 10 %; el resto, recuperación. Intensidad corta con descansos largos, un 30 % menos cada semana; sprints también un 30 % menos. Un core. Ya no se entrena nada nuevo: la carrera A pide un taper más marcado que la B."
  G: "Semana de carrera: solo zona de recuperación, como mucho 4 días; en dos de ellos, 3–4 aceleraciones de 30 s con 3 min suaves entre ellas. Sin fuerza."

# Semanas de ejemplo del libro: reparto del volumen por día. Los
# porcentajes son orientativos según el propio libro. "ADS": con síndrome de
# deficiencia aeróbica, la Z1 pasa a Z2.
semanas_ejemplo:
  - id: "UA-SEMANA-TRANSICION-CARGA"
    fuente: "cap. 10, fig. 10.2"
    dias:
      1: "Descanso."
      2: "Z2, 10 % del volumen semanal. Tarde: core y fuerza general."
      3: "Z1, 25 %."
      4: "Recuperación, 10 %."
      5: "Z2, 10 %. Tarde: core y fuerza general."
      6: "Z1 o recuperación, 15 %."
      7: "Larga en Z1 o Z2, 30 %."
  - id: "UA-SEMANA-TRANSICION-RECUPERACION"
    fuente: "cap. 10, fig. 10.3 (carga al 50 %)"
    dias:
      1: "Descanso."
      2: "Z1, 20 %."
      3: "Z2, 15 %."
      4: "Tarde: core y fuerza general."
      5: "Recuperación, 15 %."
      6: "Z1, 20 %."
      7: "Larga en Z1 o Z2, 30 %."
  - id: "UA-SEMANA-CAT1-BASE-INICIAL"
    fuente: "cap. 13, fig. 13.1 (al menos las 8 primeras semanas: acumular tiempo de carrera en baja intensidad)"
    dias:
      1: "Descanso o recuperación ligera tras un fin de semana grande."
      2: "Z1 (Z2 con ADS), hasta 15 % del desnivel semanal. Tarde: core y fuerza general."
      3: "Z2, hasta 15 % del desnivel."
      4: "Z1 o recuperación, al menos 15 % del tiempo semanal, en llano o pendiente suave. Tarde opcional: ME."
      5: "Sprints en cuesta, 6–8×10 s (cuando la fuerza lo permita)."
      6: "Z2, hasta 15 % del desnivel. Tarde opcional: Z1 o recuperación, hasta 5 %."
      7: "Z1 (Z2 con ADS), hasta 40 % del desnivel."
  - id: "UA-SEMANA-CAT1-BASE-FINAL"
    fuente: "cap. 13, fig. 13.2 (se introduce intensidad; se reduce o quita la ME al empezar la Z3)"
    dias:
      1: "Descanso o recuperación ligera."
      2: "Z1 o recuperación, hasta 10 % del tiempo, en llano o pendiente suave. Tarde: core."
      3: "Z1–Z3, hasta 15 % del desnivel, con 5–8 % en Z3; empezar con 3×8 min."
      4: "Z1 (Z2 con ADS), hasta 15 % del desnivel."
      5: "Sprints en cuesta, 6–8×10 s. Tarde opcional: Z1 o recuperación, hasta 5 %."
      6: "Z1 (Z2 con ADS), hasta 15 % del desnivel."
      7: "Z1 (Z2 con ADS), hasta 40 % del desnivel."
  - id: "UA-SEMANA-CAT1-ESPECIFICA"
    fuente: "cap. 13, fig. 13.3 (final de la base: dos días grandes seguidos)"
    dias:
      1: "Descanso o recuperación ligera."
      2: "Z1 o recuperación, hasta 10 % del tiempo. Tarde: core."
      3: "Z1–Z3, hasta 10 % del desnivel, hasta 5 % en Z3; empezar con 3×8 min."
      4: "Z1, hasta 10 % de distancia y desnivel."
      5: "Sprints en cuesta, 6–8×10 s."
      6: "Z1, 30–40 % de distancia y desnivel."
      7: "Z1, 30–40 % de distancia y desnivel."
  - id: "UA-SEMANA-CAT2-ESPECIFICA"
    fuente: "cap. 13, fig. 13.4 (más volumen e imitar la carrera larga)"
    dias:
      1: "Descanso o recuperación ligera."
      2: "Z1 o recuperación, hasta 10 % del tiempo. Tarde: core."
      3: "ME, en lugar de intervalos de Z3–Z4 durante buena parte de la base."
      4: "Z1, hasta 10 % de distancia y desnivel."
      5: "Z1, hasta 10 % de distancia y desnivel."
      6: "Z1, hasta 30 % de distancia y desnivel."
      7: "Z1, 30–40 % de distancia y desnivel."
  - id: "UA-SEMANA-CAT2-BASE-FINAL"
    fuente: "cap. 13, fig. 13.5 (más carreras y más cortas en la temporada)"
    dias:
      1: "Descanso o recuperación ligera."
      2: "Z1–Z3, hasta 15 % de distancia y desnivel, subiendo poco a poco hasta 5 % en Z3 (intervalos, tempo o progresivo). Tarde: core."
      3: "Z1 o recuperación, hasta 10 % del tiempo."
      4: "Sprints en cuesta, 6–8×10 s, dentro de un Z1 de hasta 10 % de la distancia."
      5: "Z1–Z4, hasta 10 % de distancia y desnivel; tras 4–6 semanas de Z3, hasta 5 % en Z4, empezando con 30/30 cuando la Z3 llegue al 10 %."
      6: "Z1, hasta 15 % de distancia y desnivel."
      7: "Z1, hasta 40 % de distancia y desnivel."
  - id: "UA-SEMANA-CAT2-BASE-DESNIVEL"
    fuente: "cap. 13, fig. 13.6 (carrera objetivo con mucho más desnivel del habitual)"
    dias:
      1: "Descanso o recuperación ligera."
      2: "ME y core. Tarde: recuperación."
      3: "Z1 o recuperación, hasta 10 % del desnivel."
      4: "Z1 o recuperación, hasta 10 % de distancia y desnivel."
      5: "Z2 en desnivel, hasta 15 %."
      6: "Z1 (Z2 con ADS), hasta 25 % del desnivel. Tarde: sprints en cuesta, 6–8×10 s."
      7: "Z1 (Z2 con ADS), hasta 40 % del desnivel."
    nota: "Mejor a pie y al aire libre en terreno con desnivel; valen escaleras de un edificio, cinta inclinada o máquina de escaleras."

