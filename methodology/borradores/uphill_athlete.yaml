reglas_carreras:
  - id: "UA-CARRERA-001"
    prioridad: "A"
    descripcion: "Las carreras hacia las que se construye todo el plan: necesitan un taper importante y pueden necesitar una recuperación larga después. Si hay más de una A en un ciclo, entre ellas va un periodo de base de varias semanas. Lo ideal es una o dos (cap. 9, Outline for Planning)."
  - id: "UA-CARRERA-002"
    prioridad: "B"
    descripcion: "Carreras de preparación para la A, para probar forma, estrategia, material, alimentación y cabeza. No deben exigir mucho más que tu capacidad actual: solo una ligera bajada de carga unos días antes y después, sin romper la progresión (cap. 9, Outline for Planning; cap. 11, T Week)."
    # Cifras de origen propio (decisión del atleta, 2026-10-17).
    origen_cifras: "propio"
    dias_descarga_antes: 3
    dias_recuperacion_despues: 3
    carga_pct: 70
  - id: "UA-CARRERA-003"
    prioridad: "C"
    descripcion: "Se entrenan como una sesión más, sin cambiar el plan; pueden ser tests de forma y se pueden añadir más tarde. Durante la base, solo carreras C, que apenas superen lo que haces en tus entrenamientos (cap. 9, Outline for Planning; cap. 11, Introduction to the Base Period)."
  - id: "UA-CARRERA-004"
    descripcion: "En temporada larga, entre carreras: al menos 2 semanas entre carreras cortas y 4–6 entre ultras para recuperar y reconstruir la base. Tres semanas entre carreras dejan quizá 10 días de entrenamiento útil (cap. 4, Competition Period)."
    semanas_entre_cortas_min: 2
    semanas_entre_ultras_min: 4

# Lo que no encaja en el modelo actual. Cada punto pide ampliarlo.
fuera_del_modelo:
  - "Fuerza: en la transición, core y fuerza general 2 veces por semana; al principio de la base, fuerza máxima 2 veces por semana; al final de la preparación, la fuerza muscular específica (ME) de tu tipo de carrera (cap. 9, General and Max Strength)."
  - "Fuerza muscular específica (ME): tras al menos 4 semanas de solo Z1–Z2, una vez por semana durante 8 semanas; se deja al introducir Z3 y Z4, que la mantienen. En exterior: cuesta del 20–50 % o mochila con un 10–15 % de tu peso para empezar. Al principio basta con un día a la semana (cap. 8; cap. 13, Notes on Adding More Intensity)."
  - "Evaluación de fuerza general (etapas 1 a 3 de piernas, cadera y core) antes de elegir el programa (cap. 7)."
  - "Caminar en subida cuenta como entrenamiento de carrera: en Z1–Z2 se camina en las subidas para no salir de zona, y se cuenta todo el tiempo, subidas y bajadas (cap. 5, Keep It Simple; cap. 13)."
  - "Bajadas rápidas: repeticiones cortas (1–2 min) de bajada rápida en algunos rodajes fáciles, más con el paso de las semanas; dos rodajes por semana en semanas B, I y S (cap. 5, Hill Sprints/Bounding and Downhill Speed; cap. 11)."
  - "Notas A–F de cada sesión según cómo te sentiste (A sobrado, B bien, C plano, D sin terminar o recortada, F sin entrenar por fatiga o enfermedad). Más de dos C seguidas, o una C y una D en la misma semana: parar y analizar, porque no se está asimilando la carga (cap. 4, Grading Your Workouts)."
  - "Continuidad: faltas de uno o dos días no importan si no restan más de un 5 % de la carga mensual; si la restan, hay que dar un paso atrás en el plan. No se puede hacer como si se hubiera entrenado lo que se perdió (cap. 3, Continuity)."
  - "Fatiga muscular frente a energética: qué hacer y qué evitar con agujetas, piernas pesadas o falta de energía, incluido un análisis de ferritina, que con menos de 50 ng/ml puede afectar al rendimiento (cap. 4, The Fatigue Matrix)."
  - "Seguimiento de la carga en horas y desnivel (no en km) y escala de dificultad técnica del terreno de 1 a 4 (cap. 4, Use a Training Log)."
  - "Volumen inicial sin historial, en horas anuales por edad: 20–35 años, 400 h; 35–50, 350 h; más de 50, 300 h. Empezar más suave de lo que crees (cap. 10, Where to Start)."
  - "Sin mejoras pequeñas en varias semanas entrenando más de 8 h semanales: algo falla (recuperación, carga o progresión demasiado rápida); ajustar la carga o el estilo de vida (cap. 9, Outline for Planning)."
  - "Disponibilidad real: calcular las horas libres de la semana después de trabajo, sueño, comidas, viajes y familia; es el techo de horas de entrenamiento (cap. 9, Outline for Planning)."
  - "Atletas de fibra rápida: más base Z1–Z2 y repeticiones de Z4 más cortas (menos de 2 min). De fibra lenta: dosis frecuentes y pequeñas de velocidad (cap. 3, Individuality)."

# Notas A–F del libro (cap. 4, Grading Your Workouts) a partir de la
# sensación que registra Garmin. Origen propio (decisión del atleta,
# 2026-10-17). Una sesión planificada y no hecha cuenta como F. Regla del
# libro: más de dos C seguidas, o una C y una D en la misma semana, indica
# que no se está asimilando la carga.
notas_sesion:
  origen: "propio"
  desde_sensacion_garmin:
    "Muy fuerte": "A"
    "Fuerte": "A"
    "Normal": "B"
    "Débil": "C"
    "Muy débil": "D"
  no_realizada: "F"
