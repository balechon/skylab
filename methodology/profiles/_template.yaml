# Plantilla de perfil de metodología.
# Copia este archivo a `<autor>.yaml` y rellena con las reglas reales de la
# fuente (libro, paper, apuntes). Ver methodology/README.md para la
# convención de IDs de regla.
#
# Este archivo refleja el modelo tipado en core/methodology.py
# (PerfilMetodologia). Los valores de clase_sesion, tipo_sesion y
# objetivo_mesociclo deben coincidir EXACTAMENTE con los strings de los
# Enums definidos en core/training.py (ClaseSesion, TipoSesion,
# ObjetivoMesociclo) — core/loader.py los valida contra esos Enums, no
# acepta cualquier texto.

autor: "NOMBRE_AUTOR"           # ej. "Lydiard"
fuente: ""                       # referencia bibliográfica de dónde sale esto
version: "0.1.0"

deportes_soportados:
  - ""                            # ej. "running", "trail running"

# ---------------------------------------------------------------------
# reglas: RegistroRegla — condiciones sobre UNA sesión.
# categoria es una de: Carga | Progresión | Descanso | Intensidad
# objetivo_mesociclo / clase_sesion / tipo_sesion son OPCIONALES: si se
# omiten, la regla se interpreta como "aplica siempre, sin condición".
# ---------------------------------------------------------------------
reglas:
  - id: "LYDIARD-PROGRESION-001"
    categoria: "Progresión"
    descripcion: "En mesociclos de base aeróbica, el volumen semanal no debe subir más del 10% respecto a la semana anterior."
    objetivo_mesociclo: "Base aeróbica"
    parametros:
      incremento_maximo_pct: 10

# ---------------------------------------------------------------------
# restricciones_globales: RestriccionGlobal — alcance del Plan completo,
# no de una sesión/mesociclo puntual.
# ---------------------------------------------------------------------
restricciones_globales:
  - id: "AUTOR-GLOBAL-001"
    descripcion: ""            # ej. "no más de 3 microciclos de carga seguidos sin descarga"
    parametros:
      microciclos_carga_max: 3

# ---------------------------------------------------------------------
# reglas_secuenciales: RegistroReglaSecuencial — relación entre una
# sesión y la sesión inmediatamente anterior dentro de un microciclo.
# clases_permitidas_despues es una lista de PERMITIDAS, no de prohibidas:
# cualquier ClaseSesion ausente de la lista queda prohibida después de
# clase_sesion_previa. Ojo: para expresar "todo menos X", hay que
# enumerar activamente el resto — no basta con omitir X.
# ---------------------------------------------------------------------
reglas_secuenciales:
  - id: "LYDIARD-SECUENCIA-001"
    descripcion: "Después de un entrenamiento Fondo, máximo puede hacerse un Recuperación."
    clase_sesion_previa: "Fondo"
    clases_permitidas_despues:
      - "Recuperación"
      - "Descanso"

  - id: "LYDIARD-SECUENCIA-002"
    descripcion: "No puede haber dos entrenamientos Específico seguidos."
    clase_sesion_previa: "Específico"
    clases_permitidas_despues:
      - "Fondo"
      - "Recuperación"
      - "Descanso"

# ---------------------------------------------------------------------
# reglas_conteo_microciclo: ReglaConteoMicrociclo — cuántas sesiones de
# una clase dada debe/puede haber dentro de un microciclo. Al menos uno
# de minimo/maximo es obligatorio (ambos si aplica un rango).
# ---------------------------------------------------------------------
reglas_conteo_microciclo:
  - id: "LYDIARD-CONTEO-001"
    descripcion: "Mínimo debe haber un día de entrenamiento Descanso por microciclo."
    clase_sesion: "Descanso"
    minimo: 1

# ---------------------------------------------------------------------
# reglas_ajuste: ReglaAjuste — cómo reaccionar a lo que pasó al cerrar una
# semana o un bloque: condición sobre una métrica → acción.
# metrica: adherencia_volumen_pct | adherencia_sesiones_pct | rpe_medio |
#          mejora_test_pct | mejora_indicador_pasivo_pct
# operador: "<" | "<=" | ">" | ">="
# accion: progresar | mantener | reducir_carga | repetir_microciclo |
#         adelantar_descarga | extender_mesociclo
# origen: autor (tal cual la fuente) | propio (tu interpretación numérica
#         de una indicación cualitativa del autor)
# Los cambios de carga van en porcentaje relativo a tu línea base.
# ---------------------------------------------------------------------
reglas_ajuste:
  - id: "LYDIARD-AJUSTE-001"
    descripcion: "Si se cumplió menos del 70% del volumen planeado, repetir la semana en vez de progresar."
    condicion:
      metrica: "adherencia_volumen_pct"
      operador: "<"
      valor: 70
    accion: "repetir_microciclo"
    origen: "propio"
