# Stack de PB_coach: postgres + pb-coach-api (API y agente) + pb-coach-sync
# y garmin-mcp (Garmin: sync y publicar en el reloj).
#
# Sin superficie pública: la API y el sync se publican solo en 127.0.0.1 del
# host (en el VPS se llaman por túnel SSH: ssh -L 8000:localhost:8000 ...);
# postgres y garmin-mcp no publican puertos. Ver docs/api.md y
# docs/decisions.md.
#
# Ciclo semanal (por ahora a mano; la programación automática está pendiente):
#   1. POST :8001/sync              Garmin → Postgres
#   2. POST :8000/semana/ajustar    agente: versión nueva del plan
#   3. POST :8001/publicar          próxima semana → reloj
#
#   docker compose up -d --build                   # postgres + api
#   docker compose --profile garmin up -d --build  # + pb-coach-sync + garmin-mcp
#   docker compose run --rm --build test           # tests en el contenedor
#
# Requiere un .env con las contraseñas de Postgres y PB_COACH_API_TOKEN
# (ver .env.example).

services:
  # Base pb_coach con su propio usuario. La crea docker/postgres/init.sql la
  # primera vez que se levanta el volumen.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      PB_COACH_DB_PASSWORD: ${PB_COACH_DB_PASSWORD:?Define PB_COACH_DB_PASSWORD en .env}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API + agente LLM. Sin MCP instalado. Aplica las migraciones al arrancar.
  pb-coach-api:
    build:
      context: .
      target: api
    # Solo las variables que necesita: nunca el .env completo (que incluye
    # la contraseña del superusuario de Postgres).
    environment:
      TZ: ${TZ:-America/Guayaquil}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PB_COACH_API_TOKEN: ${PB_COACH_API_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://pb_coach:${PB_COACH_DB_PASSWORD}@postgres:5432/pb_coach
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Garmin: sync de actividades y publicación de la semana en el reloj. Único
  # servicio con el SDK de MCP; no tiene la clave de Anthropic. Espera a que
  # la API haya aplicado las migraciones.
  pb-coach-sync:
    build:
      context: .
      target: sync
    profiles: ["garmin"]
    environment:
      TZ: ${TZ:-America/Guayaquil}
      PB_COACH_API_TOKEN: ${PB_COACH_API_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://pb_coach:${PB_COACH_DB_PASSWORD}@postgres:5432/pb_coach
      GARMIN_MCP_URL: http://garmin-mcp:8000/mcp
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      pb-coach-api:
        condition: service_healthy
      garmin-mcp:
        condition: service_started
    restart: unless-stopped

  # Tests (incluidos los de persistencia, en un esquema temporal de la base
  # pb_coach que se borra al terminar).
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://pb_coach:${PB_COACH_DB_PASSWORD}@postgres:5432/pb_coach
    depends_on:
      postgres:
        condition: service_healthy

  # Servidor MCP de Garmin (Taxuspt/garmin_mcp), fijado a un commit.
  # Primer login (pide el código MFA por consola):
  #   docker compose --profile garmin run --rm garmin-mcp
  garmin-mcp:
    build:
      context: https://github.com/Taxuspt/garmin_mcp.git#cfc5d799ab0f165e837f1188a1d093c65838aaf7
    profiles: ["garmin"]
    environment:
      GARMIN_EMAIL_FILE: /run/secrets/garmin_email
      GARMIN_PASSWORD_FILE: /run/secrets/garmin_password
      GARMIN_MCP_TRANSPORT: streamable-http
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: "8000"
    secrets:
      - garmin_email
      - garmin_password
    volumes:
      - garmin-tokens:/root/.garminconnect
    restart: unless-stopped

secrets:
  garmin_email:
    file: ./secrets/garmin_email.txt
  garmin_password:
    file: ./secrets/garmin_password.txt

volumes:
  postgres-data:
  garmin-tokens:
