# Stack de PB_coach: postgres + n8n (orquestador) + pb-coach-api (API y
# agente) + pb-coach-sync y garmin-mcp (sync de Garmin). Sin superficie
# pública: solo n8n publica un puerto, y únicamente en 127.0.0.1 del host; al
# editor se entra con un túnel SSH (ssh -L 5678:localhost:5678 usuario@vps).
# El resto solo es accesible dentro de la red de Docker. Ver docs/decisions.md.
#
# n8n orquesta: primero POST pb-coach-sync:8000/sync, después
# POST pb-coach-api:8000/semana/ajustar. Si Garmin falla, la API sigue
# funcionando con los datos ya guardados.
#
#   docker compose up -d --build                   # postgres + n8n + api
#   docker compose --profile garmin up -d --build  # + pb-coach-sync + garmin-mcp
#   docker compose run --rm --build test           # tests en el contenedor
#
# Requiere un .env con N8N_ENCRYPTION_KEY y las contraseñas de Postgres
# (ver .env.example).

services:
  # Una sola instancia, dos bases separadas (n8n y pb_coach), cada una con su
  # usuario. Las crea docker/postgres/init.sql la primera vez.
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Define N8N_DB_PASSWORD en .env}
      PB_COACH_DB_PASSWORD: ${PB_COACH_DB_PASSWORD:?Define PB_COACH_DB_PASSWORD en .env}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.42.3
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env}
      GENERIC_TIMEZONE: ${TZ:-America/Guayaquil}
      TZ: ${TZ:-America/Guayaquil}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Sin HTTPS: solo se accede por túnel SSH a localhost.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      pb-coach-api:
        condition: service_healthy
    restart: unless-stopped

  # API + agente LLM. Sin MCP instalado. Aplica las migraciones al arrancar.
  pb-coach-api:
    build:
      context: .
      target: api
    # Solo las variables que necesita: nunca el .env completo (que incluye
    # las contraseñas del superusuario de Postgres y de n8n).
    environment:
      TZ: ${TZ:-America/Guayaquil}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PB_COACH_API_TOKEN: ${PB_COACH_API_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://pb_coach:${PB_COACH_DB_PASSWORD}@postgres:5432/pb_coach
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Sync de Garmin → Postgres. Único servicio con el SDK de MCP; no tiene la
  # clave de Anthropic. Espera a que la API haya aplicado las migraciones.
  pb-coach-sync:
    build:
      context: .
      target: sync
    profiles: ["garmin"]
    environment:
      TZ: ${TZ:-America/Guayaquil}
      PB_COACH_API_TOKEN: ${PB_COACH_API_TOKEN:-}
      DATABASE_URL: postgresql+psycopg://pb_coach:${PB_COACH_DB_PASSWORD}@postgres:5432/pb_coach
      GARMIN_MCP_URL: http://garmin-mcp:8000/mcp
    depends_on:
      pb-coach-api:
        condition: service_healthy
      garmin-mcp:
        condition: service_started
    restart: unless-stopped

  # Tests (incluidos los de persistencia, en un esquema temporal de la base
  # pb_coach que se borra al terminar).
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://pb_coach:${PB_COACH_DB_PASSWORD}@postgres:5432/pb_coach
    depends_on:
      postgres:
        condition: service_healthy

  # Servidor MCP de Garmin (Taxuspt/garmin_mcp), fijado a un commit.
  # Primer login (pide el código MFA por consola):
  #   docker compose --profile garmin run --rm garmin-mcp
  garmin-mcp:
    build:
      context: https://github.com/Taxuspt/garmin_mcp.git#cfc5d799ab0f165e837f1188a1d093c65838aaf7
    profiles: ["garmin"]
    environment:
      GARMIN_EMAIL_FILE: /run/secrets/garmin_email
      GARMIN_PASSWORD_FILE: /run/secrets/garmin_password
      GARMIN_MCP_TRANSPORT: streamable-http
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: "8000"
    secrets:
      - garmin_email
      - garmin_password
    volumes:
      - garmin-tokens:/root/.garminconnect
    restart: unless-stopped

secrets:
  garmin_email:
    file: ./secrets/garmin_email.txt
  garmin_password:
    file: ./secrets/garmin_password.txt

volumes:
  postgres-data:
  n8n-data:
  garmin-tokens:
