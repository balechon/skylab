[project]
name = "pb-coach-persistence"
version = "0.1.0"
description = "Persistencia de PB_coach en Postgres: modelos SQLAlchemy, repositorio y migraciones Alembic."
requires-python = ">=3.12"
dependencies = [
    "pb-coach-core",
    "alembic>=1.13",
    "psycopg[binary]>=3",
    "sqlalchemy>=2",
]

[tool.uv.sources]
pb-coach-core = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# La carpeta es el paquete: `persistence/` se importa como `persistence`.
[tool.setuptools]
packages = ["persistence"]
package-dir = { "persistence" = "." }
