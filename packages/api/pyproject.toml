[project]
name = "pb-coach-api"
version = "0.1.0"
description = "API y agente LLM de PB_coach. No depende de MCP."
requires-python = ">=3.12"
dependencies = [
    "pb-coach-core",
    "pb-coach-persistence",
    "anthropic>=1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
pb-coach-core = { workspace = true }
pb-coach-persistence = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# pb_coach es un namespace package compartido por los cuatro paquetes del
# workspace: ningún paquete tiene pb_coach/__init__.py.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
