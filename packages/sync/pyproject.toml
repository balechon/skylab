[project]
name = "pb-coach-sync"
version = "0.1.0"
description = "Servicio de sync Garmin -> Postgres vía garmin-mcp. Único paquete que depende del SDK de MCP."
requires-python = ">=3.12"
dependencies = [
    "pb-coach-core",
    "pb-coach-persistence",
    "mcp>=1.9",
    "starlette",
    "uvicorn>=0.30",
]

[tool.uv.sources]
pb-coach-core = { workspace = true }
pb-coach-persistence = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# pb_coach es un namespace package compartido por los cuatro paquetes del
# workspace: ningún paquete tiene pb_coach/__init__.py.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
