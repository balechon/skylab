[project]
name = "pb-coach-core"
version = "0.1.0"
description = "Dominio y motor determinista de PB_coach: modelos, loader, calculator, validator, deviation. Sin IO."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# pb_coach es un namespace package compartido por los cuatro paquetes del
# workspace: ningún paquete tiene pb_coach/__init__.py.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
