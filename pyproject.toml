[project]
name = "pb-coach"
version = "0.1.0"
description = "Agente de planificación de entrenamiento que aplica metodología explícita y justifica cada decisión."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1",
    "fastapi>=0.115",
    "mcp>=1.9",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
