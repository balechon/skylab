# Workspace de uv (raíz virtual, sin paquete propio). Cada paquete declara
# solo sus dependencias y cada imagen Docker instala solo el suyo:
#
#   packages/core         pb-coach-core         domain + engine
#   packages/persistence  pb-coach-persistence  Postgres + migraciones
#   packages/sync         pb-coach-sync         sync de Garmin (único con MCP)
#   packages/api          pb-coach-api          API + agente LLM
#
#   uv sync --all-packages     # entorno de desarrollo con todo
#   uv run pytest

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
