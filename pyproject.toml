# Workspace de uv (raíz virtual, sin paquete propio). Cada carpeta es un
# paquete con su pyproject.toml y solo sus dependencias; cada imagen Docker
# instala solo el suyo:
#
#   core/         skylab-core         modelos y motor determinista (sin IO)
#   persistence/  skylab-persistence  Postgres + migraciones
#   sync/         skylab-sync         sync de Garmin (único con MCP)
#   agent/        skylab-agent        agente LLM + API
#
#   uv sync --all-packages     # entorno de desarrollo con todo
#   uv run pytest

[tool.uv.workspace]
members = ["core", "persistence", "sync", "agent"]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
