[project]
name = "skylab-core"
version = "0.1.0"
description = "Dominio y motor determinista de SKYLAB: modelos, loader, calculator, validator, deviation. Sin IO."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# La carpeta es el paquete: `core/` se importa como `core`.
[tool.setuptools]
packages = ["core"]
package-dir = { "core" = "." }
